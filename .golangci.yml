# golangci-lint configuration.
#
# The set is deliberately small and enforced rather than large and ignored.
# Every linter here catches a class of bug that has actually shipped in Go
# services; anything that mostly produces noise is left off.

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # An unchecked error in a broker is a silently dropped message.
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    # Formatting and import grouping, so review comments are about behaviour.
    - gofmt
    - goimports
    # Exported identifiers must be documented: this is a portfolio codebase and
    # the documentation is part of the deliverable.
    - revive
    # Contexts must be passed, not recreated.
    - contextcheck
    # A loop that shadows its variable into a goroutine is the classic Go bug.
    - bodyclose
    - noctx

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
  revive:
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers"]
      - name: package-comments
  goimports:
    local-prefixes: github.com/anashasan/gomqtt

issues:
  exclude-rules:
    # Generated by Wire; its style is not ours to enforce.
    - path: pkg/di/wire_gen\.go
      linters: [revive, goimports, gofmt, unused]
    # The packet codec deliberately names every reserved control packet type,
    # including the two the protocol forbids, so the table can be read against
    # the specification line by line.
    - path: pkg/infrastructure/mqtt/packet/packet\.go
      linters: [unused]
    # Test files may use long functions and duplicated setup for readability.
    - path: _test\.go
      linters: [revive, noctx]
  max-issues-per-linter: 0
  max-same-issues: 0
